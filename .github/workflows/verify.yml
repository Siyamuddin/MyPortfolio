name: Verify portfolio
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests, build, and database policies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: bash scripts/test-database.sh
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/portfolio_test
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --audit-level=high
